<section class="word-counter">
    <header class="header">
        <h1>Word Counter</h1>
        <p>Count words and characters instantly.</p>
    </header>

    <div class="input">
        <label for="text-input">Your text</label>
        <textarea
            id="text-input"
            aria-label="Text"
            placeholder="Start typing or paste your text here..."
            #textInput
            (input)="text.set(textInput.value)"></textarea>
    </div>

    <div class="stats">
        <div class="stat-card">
            <span class="label">Words</span>
            <output class="value" aria-label="Words">
                {{ wordCount() }}
            </output>
        </div>

        <div class="stat-card">
            <span class="label">Characters</span>
            <output class="value" aria-label="Characters">
                {{ characterCount() }}
            </output>
        </div>
    </div>
</section>
